<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Чат</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <h1>Telegram-like чат</h1>
    <div>
      <span>Вы: <strong>{{ user }}</strong></span>
      <a href="/logout">Выйти</a>
    </div>
  </header>

  <main class="chat-wrap">
    <ul id="messages" class="messages">
      {% for msg in history %}
      <li>
        {% if msg.receiver %}
          [private] {{ msg.sender }} → {{ msg.receiver }}: {{ msg.body }}
        {% else %}
          {{ msg.sender }}: {{ msg.body }}
        {% endif %}
      </li>
      {% endfor %}
    </ul>

    <form id="chat-form" class="composer">
      <input id="message" placeholder="Сообщение... (/w username текст)" autocomplete="off" required>
      <button type="submit">Отправить</button>
    </form>
  </main>

  <script src="/static/chat.js"></script>
</body>
</html>
